<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scaled boxes whose figures fit</title>
<!-- plans:kit -->
</head>
<body>
<main>
<h1>Drawn at another size, still inside the box</h1>
<p>Each figure below fills its box, and each box is drawn at another size than its layout box. No figure is wider than the box that holds it.</p>
<div style="width: 150px; margin-bottom: 4em; transform: scale(2); transform-origin: top left">
  <svg viewBox="0 0 150 40" style="width: 100%; height: auto; display: block"><title>A strip in a box drawn at twice its size</title><rect width="150" height="40" fill="currentColor"/></svg>
</div>
<div style="width: 120px; margin-bottom: 4em; transform: scale(1.5); transform-origin: top left">
  <div style="width: 100px">
    <svg viewBox="0 0 100 40" style="width: 100%; height: auto; display: block"><title>A strip in a box inside a box drawn at one and a half times its size</title><rect width="100" height="40" fill="currentColor"/></svg>
  </div>
</div>
<div style="width: 150px; margin-bottom: 1em; zoom: 2">
  <svg viewBox="0 0 150 40" style="width: 100%; height: auto; display: block"><title>A strip in a box zoomed to twice its size</title><rect width="150" height="40" fill="currentColor"/></svg>
</div>
<div style="width: 300px; overflow: hidden; transform: scale(0.5); transform-origin: top left">
  <svg viewBox="0 0 300 40" style="width: 100%; height: auto; display: block"><title>A strip in a box drawn at half its size</title><rect width="300" height="40" fill="currentColor"/></svg>
</div>
</main>
</body>
</html>
