<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log retention for the spool</title>
<script>
  // The page swallows console.error before the kit starts, so the kit's error reaches the screen
  // as its banner and never reaches the console.
  console.error = () => {}
</script>
<!-- plans:kit -->
</head>
<body>
<main>
<h1>Log retention for the spool</h1>
<p>Closed spool files stay on disk for 7 days after they ship.</p>

<fieldset data-ask="spool-days">
  <legend>How many days do shipped spool files stay on disk?</legend>
  <label><input type="radio" name="spool-days" value="7" checked> 7 days, as today</label>
  <label><input type="radio" name="spool-days" value="3" checked> 3 days</label>
</fieldset>

<section data-respond>
  <h2>Your response</h2>
</section>
</main>
</body>
</html>
