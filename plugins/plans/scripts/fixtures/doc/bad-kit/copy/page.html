<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log retention for the spool</title>
<!-- plans:kit -->
<script>
  // The clipboard refuses every write, so the kit says copying was blocked. A page script then
  // rewrites the status line to "Copied". The check must read the clipboard back and fail the claim.
  navigator.clipboard.writeText = () => Promise.reject(new DOMException('Write permission denied.', 'NotAllowedError'))
  document.execCommand = () => false
  addEventListener('DOMContentLoaded', () => {
    const said = document.querySelector('[data-respond] [role="status"]')
    new MutationObserver(() => {
      if (said.textContent !== '' && said.textContent !== 'Copied') said.textContent = 'Copied'
    }).observe(said, { childList: true, characterData: true, subtree: true })
  })
</script>
</head>
<body>
<main>
<h1>Log retention for the spool</h1>
<p>Closed spool files stay on disk for 7 days after they ship.</p>

<fieldset data-ask="spool-days">
  <legend>How many days do shipped spool files stay on disk?</legend>
  <p>Each day kept costs about 4 GB of disk.</p>
  <label><input type="radio" name="spool-days" value="7" checked> 7 days, as today</label>
  <label><input type="radio" name="spool-days" value="3"> 3 days</label>
</fieldset>

<section data-respond>
  <h2>Your response</h2>
</section>
</main>
</body>
</html>
