<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form</title>
<!-- plans:kit -->
</head>
<body>
<main>
<h1>Pick a store</h1>
<p>SQLite costs nothing to run. Postgres needs a server and its backups.</p>
<fieldset data-ask="store">
  <legend>Which store backs the cache?</legend>
  <label><input type="radio" name="store" value="sqlite" checked> SQLite</label>
  <label><input type="radio" name="store" value="pg"> Postgres</label>
</fieldset>
<form><p>A form on a page that asks questions.</p></form>
<section data-respond><h2>Respond</h2></section>
</main>
</body>
</html>
